name: build-windows
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/**']
  workflow_dispatch:
jobs:
  win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - run: make -C native win
      - uses: actions/upload-artifact@v4
        with:
          name: hanomi-windows
          path: native/build/hanomi.exe
