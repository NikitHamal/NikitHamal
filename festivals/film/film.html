<!doctype html>
<meta charset="utf-8">
<title>Festival reels</title>
<link rel="stylesheet" href="../lib/fonts.css">
<canvas id="c" width="1080" height="1920" style="width:540px"></canvas>
<script src="../lib/px.js"></script>
<script src="engine.js"></script>
<script>
// film.html?film=dashain[&f=frame]  -> window.film.{load, frame(f), total}
const q = new URLSearchParams(location.search), name = q.get('film') || 'dashain';
// Tihar uses the portfolio's own <pixel-dog> rig (js/pixel-dog.js) via the showreel engine's dogKit
const deps = name === 'tihar' ? ['../../js/pixel-dog.js', '../../showreel/shared/lib.js'] : [];
const loadJs = src => new Promise(r => { const e = document.createElement('script'); e.src = src; e.onload = r; document.body.appendChild(e); });
const s = document.createElement('script'); s.src = name + '.js';
s.onload = async () => {
  const F = (0, eval)(name.toUpperCase());
  await PX.fonts([{ spec: '40px Yatra' }, { spec: '500 40px Mukta' }, { spec: '700 40px Mukta' }, { spec: '800 40px Mukta' }, { spec: '40px Tiro' }, { spec: 'italic 500 40px Fraunces', sample: 'Aa' }, { spec: '600 40px Fraunces', sample: 'Aa' }, { spec: '40px SilkB', sample: 'AA' }, { spec: '40px PS2P', sample: '♪' }]);
  await F.load(); const c = document.getElementById('c').getContext('2d');
  window.film = { total: F.total, frame: f => F.frame(f, c) }; window.filmReady = true;
  if (q.get('f')) F.frame(+q.get('f'), c);
};
(async () => { for (const d of deps) await loadJs(d); document.body.appendChild(s); })();
</script>
