  <div class="minimal-wrapper">
    <!-- STICKY SITE HEADER (same component as home; Home replaces the Writing link) -->
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary">
        <a href="/" class="site-nav-link">Home</a>
        <button type="button" class="site-nav-link site-nav-btn" id="navContact">Contact</button>
        <span class="site-divider" aria-hidden="true"></span>
        <span class="site-controls">
          <button class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
            <span class="theme-icon">*</span>
          </button>
        </span>
      </nav>
    </header>

    <!-- WRITING HEADER -->
    <header class="writing-page-header">
      <h1 class="writing-page-title">Essays &amp; Writing</h1>
    </header>

    <!-- SEARCH + FILTER -->
    <div class="writing-tools">
      <label class="writing-search">
        <i class="ri-search-line" aria-hidden="true"></i>
        <input id="writingSearch" type="search" placeholder="Search essays..." autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <div class="chip-row" id="filterChips" role="group" aria-label="Filter by category">
        <button type="button" class="filter-chip is-active" data-cat="all">All</button>
        <button type="button" class="filter-chip" data-cat="essay">Essays</button>
        <button type="button" class="filter-chip" data-cat="reflection">Reflections</button>
        <button type="button" class="filter-chip" data-cat="poem">Poems</button>
      </div>
    </div>

    <!-- POSTS GRID / LIST -->
    <main id="writing-content" class="writing-posts-container">
      <p class="results-meta" id="resultsMeta"></p>
      <div id="postsGrid" class="writing-posts-list">
        <p style="text-align:center;padding:40px;color:var(--text-muted);">Loading essays...</p>
      </div>
      <div id="paginationContainer" style="margin-top: 24px; text-align: center;"></div>
    </main>

    <!-- FOOTER LINKS -->
    <footer class="minimal-footer">
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="https://twitter.com/nikithamal" target="_blank" rel="noopener">Twitter</a>

        <a href="https://github.com/NikitHamal" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:iamnikithamal@gmail.com">Email</a>
      </div>
    </footer>
