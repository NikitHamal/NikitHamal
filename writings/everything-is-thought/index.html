      <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 18 5-12 5 12M5 14h6m4-4h6m-3 0v8m-3 0h6"/></svg>
    </button>
  </nav>

  <!-- READING SETTINGS MODAL -->
  <section class="settings" id="readSettingsPanel" role="dialog" aria-label="Reading settings" hidden>
    <div class="settings-title">
      <h2>Reading settings</h2>
      <button class="icon-button" id="closeSettings" aria-label="Close reading settings">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
      </button>
    </div>

    <div class="setting-label ui" id="paletteLabel">Palette</div>
    <div class="themes" role="group" aria-labelledby="paletteLabel">
      <button class="theme-option" data-set-palette="default" aria-pressed="true">Default</button>
      <button class="theme-option" data-set-palette="sepia" aria-pressed="false">Sepia</button>
      <button class="theme-option" data-set-palette="slate" aria-pressed="false">Slate</button>
    </div>

    <div class="setting-label ui" id="fontLabel">Typeface</div>
    <div class="themes" role="group" aria-labelledby="fontLabel">
      <button class="theme-option font-option" data-set-font="sans" aria-pressed="true">Sans</button>
      <button class="theme-option font-option" data-set-font="serif" aria-pressed="false">Serif</button>
    </div>
    <label class="setting-label ui" for="fontSizeRange">Letter size <output id="fontSizeValue" for="fontSizeRange">16</output></label>
    <input class="range" id="fontSizeRange" type="range" min="13" max="26" step="1" value="16">
    <label class="setting-label ui" for="lineHeightRange">Breathing room <output id="lineHeightValue" for="lineHeightRange">1.80</output></label>
    <input class="range" id="lineHeightRange" type="range" min="1.5" max="2.2" step="0.02" value="1.80">
    <label class="toggle-row" for="motionToggle">Gentle movement <input class="switch" id="motionToggle" type="checkbox" checked></label>
    <p class="settings-help"><kbd>←</kbd> / <kbd>→</kbd> move sections<br><kbd>F</kbd> focus · <kbd>T</kbd> change theme<br>Settings stay in this browser locally.</p>
    <button class="reset-btn" id="resetReadingSettings">Reset reading settings</button>
  </section>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="readToast" role="status" aria-live="polite"></div>

  <script src="/js/config.js"></script>

  <script defer src="/js/sound.js?v=3"></script>
  <script defer src="/js/pixel-footer.js?v=2"></script>
  <script defer src="/js/motion.js?v=6"></script>
  <script defer src="/js/app.js"></script>
</body>
