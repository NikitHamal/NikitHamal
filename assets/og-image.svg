<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6dd6ff"/>
      <stop offset="1" stop-color="#a17eff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0d10"/>
  <!-- Refined blobs, pulled away from text zone -->
  <circle cx="980" cy="40" r="260" fill="url(#g)" opacity="0.30" filter="url(#blur)"/>
  <circle cx="120" cy="610" r="280" fill="#a17eff" opacity="0.18" filter="url(#blur)"/>

  <!-- Content safe area: 80px padding left/right, wrap heading with tspans -->
  <g fill="#e8ecf1">
    <text x="96" y="190" font-family="Poppins, Arial, sans-serif" font-size="56" font-weight="600" opacity=".88">Nikit Hamal</text>

    <text x="96" y="260" font-family="Poppins, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      <tspan x="96" dy="0">Building on the web —</tspan>
      <tspan x="96" dy="50">exploring code, apps, and</tspan>
      <tspan x="96" dy="50">ideas.</tspan>
    </text>

    <text x="96" y="420" font-family="Poppins, Arial, sans-serif" font-size="26" opacity=".9">
      Web Developer · Android App Developer · Writer · Thinker · AI Explorer
    </text>
  </g>

  <!-- CTA pill with better padding and subtle stroke -->
  <g filter="url(#softShadow)">
    <rect x="96" y="454" rx="18" width="280" height="64" fill="url(#g)" stroke="rgba(255,255,255,0.15)"/>
    <text x="126" y="496" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0d10">nikithamal.com</text>
  </g>
</svg>
