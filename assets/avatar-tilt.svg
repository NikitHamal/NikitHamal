<title id="original-tilt-title">Clean avatar — original tilt, transparent background</title>
<desc id="original-tilt-desc">Smooth editable vector recreation of the supplied avatar with clean skin, soft shading and no background. No embedded images, bitmap textures, external resources or scripts. The original head angle and composition are preserved.</desc>
