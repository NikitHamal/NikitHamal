<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hanomi · Stillwater</title>
    <style>
      html,
      body {
        margin: 0;
        background: #15392f;
        overflow: hidden;
      }
      #pond {
        position: fixed;
        inset: 0;
      }
      #pond-c {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #pond-bar {
        position: absolute;
        bottom: 65px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90%;
        image-rendering: pixelated;
        transition: opacity 0.5s;
      }
      #pond-bar.idle {
        opacity: 0.25;
      }
    </style>
  </head>
  <body>
    <div id="pond">
      <canvas id="pond-c"></canvas><canvas id="pond-bar"></canvas>
    </div>
    <script src="../js/pond.js"></script>
  </body>
</html>
