<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Carousel Studio — Nikit Hamal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <!-- JSZip for 1-click bulk download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-studio: #f4f3ef;
      --panel-bg: #ffffff;
      --text-main: #18181b;
      --text-muted: #766358;
      --border-color: rgba(0, 0, 0, 0.08);
      --accent: #18181b;
      --paper-bg: #fbf5ed;
      --paper-ink: #1c1512;
      --paper-body: #2d221c;
      --paper-line: rgba(75, 45, 25, 0.08);
    }

    [data-theme="dark"] {
      --bg-studio: #121214;
      --panel-bg: #1a1a1e;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #ffffff;
      --paper-bg: #1c1816;
      --paper-ink: #f7f3ee;
      --paper-body: #dcd3cb;
      --paper-line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-studio);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Studio Header */
    .studio-header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      background: rgba(0,0,0,0.06);
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--text-muted);
    }

    [data-theme="dark"] .brand-tag {
      background: rgba(255,255,255,0.1);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--panel-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.18);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--panel-bg);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      opacity: 0.92;
      background: var(--accent);
    }

    /* Controls Bar */
    .controls-bar {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .select-input, .range-input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-studio);
      color: var(--text-main);
      font-size: 0.82rem;
    }

    .view-toggle {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .toggle-btn {
      padding: 6px 12px;
      background: var(--panel-bg);
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: var(--panel-bg);
    }

    /* Workspace */
    .workspace {
      flex: 1;
      padding: 40px 28px 80px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: auto;
    }

    /* Grid Layout */
    .slides-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 1600px;
    }

    /* Carousel Single View */
    .slides-carousel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 600px;
    }

    .carousel-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .carousel-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* Slide Card Preview Box */
    .slide-wrapper {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .slide-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .slide-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #10b981;
      font-weight: 500;
    }

    /* The 1080x1350 scaled container */
    .canvas-viewport {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      background: #faf9f6;
    }

    /* Actual 1080x1350 canvas placed inside and scaled with CSS transform */
    .canvas-content {
      width: 1080px;
      height: 1350px;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      background: var(--paper-bg);
      color: var(--paper-ink);
      font-family: 'Newsreader', Georgia, serif;
      padding: 96px 96px 92px 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: text;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #71717a;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--paper-line);
    }

    .canvas-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--para-gap, 24px);
      padding: 24px 0;
    }

    .canvas-body p {
      font-size: var(--body-size, 23.2px);
      line-height: var(--body-lh, 1.58);
      color: var(--paper-body);
      font-weight: 400;
      text-wrap: pretty;
      letter-spacing: -0.005em;
    }

    .canvas-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #8e8e93;
      padding-top: 24px;
      border-top: 1px solid var(--paper-line);
    }

    /* Cover Slide Specifics */
    .cover-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 20px;
      gap: 36px;
    }

    .cover-art {
      width: 230px;
      height: 230px;
      color: var(--paper-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.88;
    }

    .cover-art svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cover-title-group {
      max-width: 840px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .cover-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 64px;
      line-height: 1.14;
      font-weight: 500;
      color: var(--paper-ink);
      letter-spacing: -0.025em;
    }

    .cover-hook {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 24px;
      line-height: 1.5;
      color: #52525b;
      font-style: italic;
      max-width: 680px;
    }

    .cover-byline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #71717a;
      margin-top: 8px;
    }

    .cover-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.08);
      font-weight: 500;
      letter-spacing: 0.14em;
    }

    /* Actions bottom bar for each card */
    .slide-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
    }

    .download-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(0,0,0,0.04);
      transition: background 0.15s;
    }

    .download-link-btn:hover {
      background: rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

  <!-- Studio Header -->
  <header class="studio-header">
    <div class="studio-brand">
      <a href="writing.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:0.9rem;margin-right:8px;">
        <i class="ri-arrow-left-line"></i> Writing
      </a>
      <h1 class="brand-title">Instagram Carousel Studio</h1>
      <span class="brand-tag">1080 × 1350 px · 4:5</span>
    </div>

    <div class="header-actions">
      <button class="btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
        <i class="ri-sun-line" id="themeIcon"></i>
      </button>
      <button class="btn btn-primary" id="downloadZipBtn" onclick="downloadAllZip()">
        <i class="ri-download-cloud-line"></i> Download All (ZIP)
      </button>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="control-group">
      <span class="control-label">Essay Set:</span>
      <select class="select-input" id="modeSelect" onchange="switchMode(this.value)">
        <option value="excerpts" selected>Excerpts Only (8 Slides · Quick Read & CTA)</option>
        <option value="complete19">Complete Essay (19 Slides · Full 3,098 words)</option>
        <option value="part1">Part 1 (10 Slides · Mobile 32px)</option>
        <option value="part2">Part 2 (10 Slides · Mobile 32px)</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Font Size:</span>
      <input type="range" class="range-input" id="fontSizeSlider" min="26" max="38" step="0.5" value="32" oninput="updateTypography()" />
      <span id="fontSizeVal" style="font-family:'JetBrains Mono';font-size:0.8rem;">32px</span>
    </div>

    <div class="control-group">
      <span class="control-label">Line Height:</span>
      <input type="range" class="range-input" id="lineHeightSlider" min="1.45" max="1.85" step="0.02" value="1.64" oninput="updateTypography()" />
      <span id="lineHeightVal" style="font-family:'JetBrains Mono';font-size:0.8rem;">1.64</span>
    </div>

    <div class="control-group">
      <span class="control-label">View:</span>
      <div class="view-toggle">
        <button class="toggle-btn active" id="btnGrid" onclick="setViewMode('grid')">
          <i class="ri-grid-fill"></i> Grid (All 10)
        </button>
        <button class="toggle-btn" id="btnCarousel" onclick="setViewMode('carousel')">
          <i class="ri-slideshow-3-line"></i> Carousel
        </button>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <main class="workspace" id="workspace">
    <div class="slides-grid" id="slidesContainer">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Motion forms & posts data -->
  <script src="js/motion-forms.js"></script>

  <script>
    let currentMode = 'excerpts';
    let currentSlideIndex = 0;
    let viewMode = 'grid';

    let essayData = null;
    let paragraphs = [];

    const fullUrl = 'https://nikit.is-a.dev/read.html?slug=the-lie-of-being-yourself';

    const excerptParas = [
      [
        "We say these things so easily. Be yourself. Find yourself. Know who you really are. As if somewhere inside you there is a person who has been sitting quietly, waiting for you to discover him. The world covered him with expectations, your parents covered him with their ambitions, your relationships covered him with hurts, and now your job is to remove all of this and bring the original person out. It is a comforting idea. There is something real underneath, something untouched, and whatever happens on the surface, at least that thing is still yours. But have you actually found such a thing, or do you only hope it is there?"
      ],
      [
        "You are quiet around some people and talk endlessly around others. With someone you feel no need to impress, words come easily. With someone whose approval you want, even saying a simple thing becomes a small performance. You go home and ask, why couldn't I be myself there? But both situations tell you something. Your ease tells you something, and so does your fear. Why must one be you and the other not you? Can't you look at the fear without first pushing it outside your identity?",
        "Of course there is pretending. You laugh when you don't find something funny. You agree because you are afraid of being disliked. You act interested while wishing you could leave. There is a difference between what you feel and what you show, and it can be tiring to live like that. But to notice this doesn't require the discovery of an eternal, original you. It requires honesty about what is happening. “I don't agree, but I want this person to like me.” That is already much closer to the fact than “I have lost my true self.”"
      ],
      [
        "The fact may be quite ordinary and uncomfortable. The story of the lost self is more attractive. It gives you a journey. You can go somewhere, read something, become someone who is working on himself. Meanwhile, the simple thing remains untouched: you are afraid to disappoint this person. You want approval. Can that be looked at without immediately turning it into a project of becoming fearless?",
        "Even your rebellion deserves a little attention. You say you are finished living according to others. Now you will do the opposite of what they wanted. But if everything you do is still a reply to them, in what sense have you stopped being directed by them? Their approval used to guide you. Now their disapproval guides you. I am not saying don't leave, don't refuse, don't change your life. Those things may be necessary. I am asking whether opposition, by itself, is the discovery of something independent."
      ],
      [
        "And why should being shaped make you false? This is another assumption we hardly question. If a friend introduced you to something and you came to love it, is your love less real? If someone treated you gently and you became a little less afraid, is that openness fake because it came through a relationship? We want to remove every influence to find what is purely our own. But perhaps there is no person left over after every relationship with life has been removed. Perhaps we have mistaken dependence on life for a kind of contamination.",
        "You didn't first exist as a complete person and then begin having experiences. The experiencing, the learning, the being hurt, the responding, all of this is involved in what you call a person. There isn't a finished you underneath, receiving additions. What you are is taking shape in the very living of it. And this taking shape has not stopped just because you have found a few words that seem to describe you well."
      ],
      [
        "You are a process. But please don't make the word sound grand. It means this ordinary movement of being affected and responding, carrying something forward, forgetting something, discovering that what mattered so much no longer matters in the same way. Sometimes the movement is so repetitive that it feels completely still. You meet a new person and bring the same fear. You enter a new situation and expect the same rejection. The repetition is real. But a pattern repeating is not proof of an unchanging person inside it. It may only mean that the conditions which keep the pattern going are still there.",
        "And this is where “being yourself” can become an excuse. “This is just how I am. Take me as I am.” What do you mean? Do you mean, see what is actually here, without demanding that I fit your imagination? Or do you mean, don't question what I do, because I have decided it is permanent? Those are very different things. Accepting that you are angry now doesn't mean declaring anger your lifelong nature. Seeing a fact doesn't require you to promise that the fact will never change."
      ],
      [
        "If you hurt someone, “I am a process” doesn't make the hurt disappear. You still have to hear what they are saying. You may have to apologize, repair something, change how you behave. There is no need for an eternal self in order for actions to have consequences. In fact, the insistence that “I am not that kind of person” can prevent you from taking responsibility. You become so occupied with defending who you are that you barely listen to what you have done.",
        "We do this to other people too. We decide who they are, then keep meeting our decision. Someone who has usually been strong comes to you frightened, and you tell them this isn't like them (I do this a lot). Someone who has always adjusted to you finally refuses, and you say they have changed. Maybe they have. Maybe something was happening all along that your image didn't allow you to see. Knowing someone cannot mean that they are no longer allowed to surprise you."
      ]
    ];

    function getPngPath(idx) {
      const num = String(idx + 1).padStart(2, '0');
      if (currentMode === 'excerpts') {
        return `assets/insta/the-lie-of-being-yourself/excerpts/slide-${num}.png`;
      } else if (currentMode === 'complete19') {
        return `assets/insta/the-lie-of-being-yourself/complete-19/slide-${num}.png`;
      } else if (currentMode === 'part2') {
        return `assets/insta/the-lie-of-being-yourself/part2/slide-${num}.png`;
      }
      return `assets/insta/the-lie-of-being-yourself/slide-${num}.png`;
    }

    async function init() {
      try {
        const res = await fetch('posts/the-lie-of-being-yourself.json');
        essayData = await res.json();
        
        // Parse paragraphs
        const rawParas = essayData.contentHtml.match(/<p>([\s\S]*?)<\/p>/g) || [];
        paragraphs = rawParas.map(p => {
          return p.replace(/<[^>]+>/g, '').replace(/~Proofread by.*/, '').trim();
        }).filter(Boolean);

        updateDownloadBtnText();
        renderSlides();
        setupResizeObserver();
      } catch (err) {
        console.error('Failed to load essay data:', err);
      }
    }

    function getSlidesData() {
      if (currentMode === 'excerpts') {
        const slides = [
          { type: 'cover', title: 'Wrote a long piece of text on<br>“the lie of being yourself”.', subtitle: 'Some excerpts:', titleSize: '58px' }
        ];
        excerptParas.forEach(paras => {
          slides.push({ type: 'text', paras });
        });
        slides.push({ type: 'cta', url: fullUrl });
        return slides;
      } else if (currentMode === 'complete19') {
        const slides = [{ type: 'cover', subtitle: '“You say, ‘I just want to be myself.’ What do you mean by that? Which self are you talking about?”' }];
        // 17 slides of 2 paragraphs each (34 paragraphs)
        for (let i = 0; i < 17; i++) {
          slides.push({
            type: 'text',
            paras: paragraphs.slice(i * 2, i * 2 + 2)
          });
        }
        // Slide 19: Final paragraph + clean link
        slides.push({
          type: 'text',
          paras: paragraphs.slice(34, 35),
          isFinal: true
        });
        return slides;
      } else if (currentMode === 'part1') {
        const slides = [{ type: 'cover', subtitle: '“You say, ‘I just want to be myself.’ What do you mean by that? Which self are you talking about?”' }];
        for (let i = 0; i < 9; i++) {
          slides.push({
            type: 'text',
            paras: paragraphs.slice(i * 2, i * 2 + 2),
            isFinal: i === 8
          });
        }
        return slides;
      } else {
        const slides = [{ type: 'cover', subtitle: '“Part 2 · The lie of ‘being yourself’”' }];
        for (let i = 0; i < 9; i++) {
          slides.push({
            type: 'text',
            paras: paragraphs.slice(18 + i * 2, 18 + i * 2 + 2),
            isFinal: i === 8
          });
        }
        return slides;
      }
    }

    function updateDownloadBtnText() {
      const slides = getSlidesData();
      const btn = document.getElementById('downloadZipBtn');
      if (btn) {
        btn.innerHTML = `<i class="ri-download-cloud-line"></i> Download All ${slides.length} PNGs (ZIP)`;
      }
    }

    function renderSlides() {
      const container = document.getElementById('slidesContainer');
      const slides = getSlidesData();

      if (viewMode === 'grid') {
        container.className = 'slides-grid';
        container.innerHTML = slides.map((slide, idx) => generateSlideCardHtml(slide, idx)).join('');
      } else {
        container.className = 'slides-carousel';
        if (currentSlideIndex >= slides.length) currentSlideIndex = 0;
        const slide = slides[currentSlideIndex];
        container.innerHTML = `
          <div class="carousel-nav">
            <button class="btn" onclick="prevSlide()"><i class="ri-arrow-left-s-line"></i> Prev</button>
            <span class="carousel-indicator">Slide ${String(currentSlideIndex + 1).padStart(2, '0')} of ${String(slides.length).padStart(2, '0')}</span>
            <button class="btn" onclick="nextSlide()">Next <i class="ri-arrow-right-s-line"></i></button>
          </div>
          ${generateSlideCardHtml(slide, currentSlideIndex)}
        `;
      }

      scaleCanvases();
    }

    function generateCuteSvg(isCover = false) {
      return `
        <svg class="cute-bg" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:1080px;height:1350px;pointer-events:none;z-index:1;">
          <g transform="rotate(12, 48, 52)">
            <circle cx="48" cy="35.8" r="12.9" fill="#f8c2ce" fill-opacity="0.45" stroke="#ba4867" stroke-width="1.6" stroke-opacity="0.65" />
            <circle cx="64.4" cy="46.3" r="12.9" fill="#f8c2ce" fill-opacity="0.45" stroke="#ba4867" stroke-width="1.6" stroke-opacity="0.65" />
            <circle cx="58.1" cy="65.7" r="12.9" fill="#f8c2ce" fill-opacity="0.45" stroke="#ba4867" stroke-width="1.6" stroke-opacity="0.65" />
            <circle cx="37.9" cy="65.7" r="12.9" fill="#f8c2ce" fill-opacity="0.45" stroke="#ba4867" stroke-width="1.6" stroke-opacity="0.65" />

    function generateSlideCardHtml(slide, idx) {
      const slideNum = String(idx + 1).padStart(2, '0');
      const motionSvg = window.getMotionFormSvg ? window.getMotionFormSvg('the-lie-of-being-yourself') : '';
      const pngPath = getPngPath(idx);
      const cuteBg = generateCuteSvg(slide.type === 'cover' || slide.type === 'cta');

      let innerContent = '';
      if (slide.type === 'cover') {
        innerContent = `
          ${cuteBg}
          <div class="cover-center" style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;">
            <div class="cover-art" style="width:250px;height:250px;">
              ${motionSvg}
            </div>
            <div class="cover-title-group" style="gap:24px;">
              <h1 class="cover-title" style="font-size:${slide.titleSize || '72px'};line-height:1.16;letter-spacing:-0.02em;">${slide.title || 'The lie of<br>“being yourself”'}</h1>
              <p class="cover-hook" style="font-size:26px;line-height:1.52;max-width:720px;font-style:italic;">${slide.subtitle || '“You say, ‘I just want to be myself.’ What do you mean by that? Which self are you talking about?”'}</p>
            </div>
          </div>
        `;
      } else if (slide.type === 'cta') {
        innerContent = `
          ${cuteBg}
          <div class="cover-center" style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;text-align:center;">
            <div class="cover-art" style="width:200px;height:200px;">
              ${motionSvg}
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:24px;max-width:760px;">
              <h2 style="font-family:'Newsreader',Georgia,serif;font-size:52px;font-weight:500;letter-spacing:-0.02em;">Continue Reading</h2>
              <p style="font-family:'Newsreader',Georgia,serif;font-size:26px;line-height:1.5;font-style:italic;color:var(--paper-body);">If it interests you, can read the full text here:</p>
              <div style="margin-top:8px;padding:16px 28px;background:rgba(186, 72, 103, 0.08);border:1px solid rgba(186, 72, 103, 0.25);border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:0.06em;color:#992e4a;font-weight:600;">${slide.url}</div>
              <span style="font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-muted);margin-top:8px;">Nikit Hamal</span>
            </div>
          </div>
        `;
      } else {
        const isExcerpts = currentMode === 'excerpts';
        const parasHtml = isExcerpts
          ? slide.paras.map((p, i) => {
              const sep = (i < slide.paras.length - 1)
                ? `<div style="font-family:'Newsreader',Georgia,serif;font-size:26px;letter-spacing:0.28em;color:var(--text-muted);text-align:center;opacity:0.65;margin:4px 0;">· · ·</div>`
                : '';
              return `<p style="font-size:var(--body-size, 31.5px);line-height:var(--body-lh, 1.64);">\u201c${p}\u201d</p>${sep}`;
            }).join('')
          : slide.paras.map(p => `<p style="font-size:var(--body-size, 32px);line-height:var(--body-lh, 1.64);">${p}</p>`).join('');

        innerContent = `
          ${cuteBg}
          <div class="canvas-body" style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;gap:${isExcerpts ? '38px' : '48px'};padding:40px 10px ${isExcerpts ? '60px' : '10px'} 10px;">
            ${parasHtml}
            ${slide.isFinal ? `
            <div style="margin-top:16px;padding:18px 24px;border:1px dashed rgba(186, 72, 103, 0.35);border-radius:12px;background:rgba(186, 72, 103, 0.04);display:flex;flex-direction:column;gap:6px;">
              <span style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);">Read the full essay online:</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:500;color:var(--paper-ink);word-break:break-all;">${fullUrl}</span>
            </div>` : ''}
          </div>
        `;
      }

      return `
        <div class="slide-wrapper" id="slide-wrapper-${idx}">
          <div class="slide-topbar">
            <span>SLIDE ${slideNum}</span>
            <span class="slide-status"><i class="ri-checkbox-circle-fill"></i> Ready</span>
          </div>
          
          <div class="canvas-viewport" id="viewport-${idx}">
            <div class="canvas-content" id="canvas-${idx}">
              ${innerContent}
            </div>
          </div>

          <div class="slide-actions">
            <span style="font-family:'JetBrains Mono';font-size:0.75rem;color:var(--text-muted);">1080 × 1350 PNG</span>
            <a href="${pngPath}" download="the-lie-of-being-yourself-${currentMode}-slide-${slideNum}.png" class="download-link-btn">
              <i class="ri-download-line"></i> Download PNG
            </a>
          </div>
        </div>
      `;
    }

    function scaleCanvases() {
      const viewports = document.querySelectorAll('.canvas-viewport');
      viewports.forEach(vp => {
        const width = vp.offsetWidth;
        const scale = width / 1080;
        const canvas = vp.querySelector('.canvas-content');
        if (canvas) {
          canvas.style.transform = `scale(${scale})`;
        }
      });
    }

    function updateTypography() {
      const fontSize = document.getElementById('fontSizeSlider').value;
      const lineHeight = document.getElementById('lineHeightSlider').value;
      document.getElementById('fontSizeVal').textContent = fontSize + 'px';
      document.getElementById('lineHeightVal').textContent = lineHeight;

      document.querySelectorAll('.canvas-content').forEach(canvas => {
        canvas.style.setProperty('--body-size', fontSize + 'px');
        canvas.style.setProperty('--body-lh', lineHeight);
      });
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('btnCarousel').classList.toggle('active', mode === 'carousel');
      renderSlides();
    }

    function switchMode(val) {
      currentMode = val;
      currentSlideIndex = 0;
      updateDownloadBtnText();
      renderSlides();
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlides();
      }
    }

    function nextSlide() {
      const slides = getSlidesData();
      if (currentSlideIndex < slides.length - 1) {
        currentSlideIndex++;
        renderSlides();
      }
    }

    function toggleTheme() {
      const doc = document.documentElement;
      const isDark = doc.getAttribute('data-theme') === 'dark';
      doc.setAttribute('data-theme', isDark ? 'light' : 'dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'ri-sun-line' : 'ri-moon-line';
    }

    async function downloadAllZip() {
      const btn = document.getElementById('downloadZipBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="ri-loader-4-line ri-spin"></i> Bundling ZIP...`;
      btn.disabled = true;

      try {
        const slides = getSlidesData();
        const zip = new JSZip();
        const folderName = `the-lie-of-being-yourself-${currentMode}`;
        const folder = zip.folder(folderName);

        for (let i = 0; i < slides.length; i++) {
          const num = String(i + 1).padStart(2, '0');
          const path = getPngPath(i);
          const resp = await fetch(path);
          if (resp.ok) {
            const blob = await resp.blob();
            folder.file(`slide-${num}.png`, blob);
          }
        }

        const zipBlob = await zip.generateAsync({ type: "blob" });
        const downloadUrl = URL.createObjectURL(zipBlob);
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = `${folderName}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        btn.innerHTML = `<i class="ri-check-line"></i> Downloaded!`;
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2500);
      } catch (err) {
        console.error('Error generating zip:', err);
        btn.innerHTML = `Error creating zip`;
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }

    function setupResizeObserver() {
      window.addEventListener('resize', () => {
        scaleCanvases();
      });
      document.addEventListener('keydown', (e) => {
        if (viewMode === 'carousel') {
          if (e.key === 'ArrowLeft') prevSlide();
          if (e.key === 'ArrowRight') nextSlide();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
